[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
user=vintagestory

[unix_http_server]
file=%(ENV_VINTAGE_STORY_PATH)s/supervisord.sock

[supervisorctl]
serverurl=unix:///%(ENV_VINTAGE_STORY_PATH)s/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; The server program definition is generated by entrypoint.sh at every start.
; That keeps the vanilla / Stratum kernel switch to a single environment change.
[include]
files=%(ENV_VINTAGE_STORY_PATH)s/program-*.conf

[program:backup]
command=supercronic "%(ENV_VINTAGE_STORY_PATH)s/backup_crontab"
autostart=true
autorestart=true
startsecs=0
user=vintagestory
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0 
stderr_logfile=/dev/stderr 
stderr_logfile_maxbytes=0
